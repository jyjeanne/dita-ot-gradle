name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gradle-version: ['8.14.4', '9.0', '9.9.1']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set Gradle version to ${{ matrix.gradle-version }}
      run: |
        sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-${{ matrix.gradle-version }}-bin.zip|' gradle/wrapper/gradle-wrapper.properties

    - name: Build plugin
      run: ./gradlew clean assemble --no-daemon --stacktrace

    - name: Run unit tests
      run: ./gradlew test --no-daemon --stacktrace

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-gradle-${{ matrix.gradle-version }}
        path: build/reports/tests/test/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      if: matrix.gradle-version == '8.14.4'
      with:
        name: plugin-jar
        path: build/libs/*.jar

  integration-test:
    name: Linux Integration Tests - DITA-OT ${{ matrix.dita-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dita-version: ['3.4', '3.5', '3.6', '4.4.2']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install plugin to Maven Local
      run: ./gradlew publishToMavenLocal --no-daemon

    # test-project downloads DITA-OT with the plugin's DitaOtDownloadTask, runs a real
    # html5 transformation, and fails unless index.html and test-topic.html are produced.
    - name: Transform test project with DITA-OT ${{ matrix.dita-version }}
      working-directory: test-project
      run: |
        chmod +x gradlew
        ./gradlew verifyOutput -PditaOtVersion=${{ matrix.dita-version }} --no-daemon --no-configuration-cache --stacktrace

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-test-dita-${{ matrix.dita-version }}
        path: test-project/build/
        if-no-files-found: ignore

  build-windows:
    name: Windows Build & Test
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build plugin (Windows)
      run: .\gradlew.bat clean assemble --no-daemon --stacktrace

    - name: Run unit tests (Windows)
      run: .\gradlew.bat test --no-daemon --stacktrace

    - name: Upload test results (Windows)
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-windows
        path: build/reports/tests/test/

  integration-test-windows:
    name: Windows Integration Tests - DITA-OT ${{ matrix.dita-version }}
    needs: build-windows
    runs-on: windows-latest
    strategy:
      matrix:
        dita-version: ['3.5', '3.6', '4.4.2']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install plugin to Maven Local (Windows)
      run: .\gradlew.bat publishToMavenLocal --no-daemon

    # Note: DITA-OT 4.x's dita.bat builds a long CLASSPATH from absolute jar paths, which can
    # exceed the 8191-character cmd.exe limit on deeply nested checkouts. The plugin then runs
    # dita.bat through its 8.3 short path (WindowsCommandLine). The runner's short D:\a\...
    # path stays under the limit, so that fallback is covered by unit tests, not by this job.
    - name: Transform test project (Windows - DITA-OT ${{ matrix.dita-version }})
      working-directory: test-project
      run: .\gradlew.bat verifyOutput "-PditaOtVersion=${{ matrix.dita-version }}" --no-daemon --no-configuration-cache --stacktrace

    - name: Upload Windows integration test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-test-windows-dita-${{ matrix.dita-version }}
        path: test-project/build/
        if-no-files-found: ignore

  publish:
    name: Publish to Gradle Plugin Portal
    needs: [build, integration-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Publish plugin
      env:
        GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      run: ./gradlew publishPlugins --no-daemon --stacktrace
